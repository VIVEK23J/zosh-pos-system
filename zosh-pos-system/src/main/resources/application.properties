spring.application.name=zosh-pos-system
server.port=${SERVER_PORT:5000}

# ===================================================================
# MySQL Database Connection
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/storeSystem}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# ===================================================================
# Hibernate & JPA Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Web & Dispatcher Logging
# ===================================================================
logging.level.org.springframework.web=${LOG_LEVEL_WEB:DEBUG}
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# ===================================================================
# Razorpay Payment Gateway Configuration
# -------------------------------------------------------------------
# When switching to REAL/LIVE credentials, replace rzp_test_... with your rzp_live_...
# keys in your .env file or environment variables. No code changes required!
# ===================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_51b4l8yZ000000}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:test_secret_placeholder}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
razorpay.company.name=${RAZORPAY_COMPANY_NAME:ZOSH POS Retail}
